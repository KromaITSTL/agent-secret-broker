<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">agent-secret-broker</title>
  <desc id="d">Agents use secret handles; the broker injects the value into an approved command or request, and the agent only ever sees a redacted placeholder.</desc>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8f7f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2f8f7f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill-opacity="0.12" fill="#5fb3a3"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="18" fill="#111514"/>
  <rect width="1280" height="340" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="17.5" fill="none" stroke="#2b3331"/>

  <!-- mark -->
  <g transform="translate(72 74)">
    <rect width="64" height="64" rx="15" fill="#2f8f7f"/>
    <circle cx="32" cy="27" r="10" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="29.5" y="35" width="5" height="16" rx="2.5" fill="#ffffff"/>
  </g>

  <text x="156" y="104" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e8ecea" letter-spacing="-0.5">agent-secret-broker</text>
  <text x="156" y="136" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9aa5a1">Your agents use secrets. They never see them.</text>

  <text x="72" y="216" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa5a1">
    <tspan x="72" dy="0">Handles, not values. You approve each secret per repo, per host</tspan>
    <tspan x="72" dy="26">or command, from a link on your phone. Every use is audited.</tspan>
  </text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="72" y="262" width="118" height="30" rx="15" fill="#182020" stroke="#2b3331"/>
    <text x="131" y="282" text-anchor="middle" fill="#e8ecea">Claude Code</text>
    <rect x="200" y="262" width="104" height="30" rx="15" fill="#182020" stroke="#2b3331"/>
    <text x="252" y="282" text-anchor="middle" fill="#e8ecea">Claude app</text>
    <rect x="314" y="262" width="76" height="30" rx="15" fill="#182020" stroke="#2b3331"/>
    <text x="352" y="282" text-anchor="middle" fill="#e8ecea">Codex</text>
    <rect x="400" y="262" width="168" height="30" rx="15" fill="#182020" stroke="#2b3331"/>
    <text x="484" y="282" text-anchor="middle" fill="#e8ecea">Cloudflare Workers</text>
  </g>

  <!-- flow card -->
  <g transform="translate(700 46)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="508" height="248" rx="14" fill="#161c1b" stroke="#2b3331"/>
    <text x="24" y="38" font-size="12" fill="#9aa5a1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" letter-spacing="1">WHAT THE AGENT SENDS</text>
    <text x="24" y="66" font-size="15" fill="#e8ecea">env: DATABASE_URL =</text>
    <rect x="212" y="49" width="270" height="26" rx="6" fill="#1d332f"/>
    <text x="222" y="67" font-size="15" fill="#8fd4c6">secret://acme/DB_URL</text>

    <line x1="24" y1="96" x2="484" y2="96" stroke="#2b3331"/>
    <text x="24" y="124" font-size="12" fill="#9aa5a1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" letter-spacing="1">WHAT RUNS (APPROVED)</text>
    <text x="24" y="152" font-size="15" fill="#e8ecea">supabase db push</text>
    <rect x="200" y="137" width="110" height="22" rx="11" fill="#1d332f"/>
    <text x="255" y="152" font-size="12" text-anchor="middle" fill="#8fd4c6" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">value injected</text>

    <line x1="24" y1="176" x2="484" y2="176" stroke="#2b3331"/>
    <text x="24" y="204" font-size="12" fill="#9aa5a1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" letter-spacing="1">WHAT THE AGENT SEES</text>
    <text x="24" y="226" font-size="14" fill="#e8ecea">Applying migration to [redacted:secret://acme/DB_URL]</text>
  </g>
</svg>
